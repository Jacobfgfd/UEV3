async function renderServer(main) {
  setTopbar({ title: 'Community server', back: '/you' });
  main.innerHTML = '';
  const wrap = h('div.wrap.narrow');
  main.appendChild(wrap);

  const s = settings.get();
  const input = h('input', {
    type: 'text', value: s.serverUrl || '', placeholder: 'https://cairn.my-church.example.com',
    'aria-label': 'Community server address', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
  });
  const status = h('p.hint', { style: { marginTop: '.5rem' } });

  wrap.appendChild(h('div.card', null,
    h('div.card-head', null, h('h2', null, 'Two ways to use the community')),
    h('p', { style: { fontSize: '.88rem', lineHeight: '1.6', color: 'var(--text-dim)' } },
      h('strong', { style: { color: 'var(--text)' } }, 'Local mode (default). '),
      'Groups, stories and the prayer wall all work, but only you see them. Nothing is uploaded, no account is needed, and nobody can see your data.'),
    h('p', { style: { fontSize: '.88rem', lineHeight: '1.6', color: 'var(--text-dim)', marginTop: '.7rem' } },
      h('strong', { style: { color: 'var(--text)' } }, 'Connected. '),
      'Point the app at a Cairn server and the same screens become a real shared community. The server is in the ',
      h('code', null, 'server/'),
      ' folder of this project: one file, no dependencies, and it runs free on any machine or free hosting tier.'),
  ));

  wrap.appendChild(h('label.field', { style: { marginTop: '1.2rem' } },
    h('span.lab', null, 'Server address'), input, status));

  wrap.appendChild(h('div.btn-row', null,
    h('button.btn', {
      type: 'button', style: { flex: '1' },
      onclick: async () => {
        const url = input.value.trim().replace(/\/+$/, '');
        if (!url) {
          settings.set({ serverUrl: '' });
          status.textContent = 'Local mode — nothing leaves this device.';
          toast('Local mode');
          return;
        }
        if (!/^https?:\/\//i.test(url)) { toast('The address needs to start with http:// or https://', 'err'); return; }
        status.textContent = 'Checking…';
        const health = await net.checkServer(url);
        if (!health.ok) {
          status.textContent = `Could not reach it. ${health.error || ''}`.trim();
          toast('That server did not answer.', 'err');
          return;
        }
        settings.set({ serverUrl: url });
        status.textContent = `Connected to ${health.name}.`;
        toast('Connected');
        render(main);
      },
    }, 'Connect'),
    h('button.btn.ghost', {
      type: 'button',
      onclick: () => { input.value = ''; settings.set({ serverUrl: '' }); status.textContent = 'Local mode.'; toast('Local mode'); },
    }, 'Use local mode'),
  ));

  if (s.serverUrl) {
    const health = await net.checkServer();
    status.textContent = health.ok ? `Connected to ${health.name}.` : `Not answering right now. ${health.error || ''}`.trim();
  } else {
    status.textContent = 'Local mode — nothing leaves this device.';
  }

  wrap.appendChild(h('p.section-label', null, 'Running your own'));
  wrap.appendChild(h('div.card', null,
    h('p', { style: { fontSize: '.85rem', lineHeight: '1.6', color: 'var(--text-dim)' } },
      'From the project folder:'),
    h('pre', {
      style: {
        background: 'var(--surface-2)', padding: '.7rem .8rem', borderRadius: '9px',
        fontSize: '.78rem', overflowX: 'auto', marginTop: '.6rem', fontFamily: 'ui-monospace, Menlo, Consolas, monospace',
      },
    }, 'node server/server.js\n# then connect to http://localhost:8787'),
    h('div.btn-row', { style: { marginTop: '.8rem' } },
      h('button.btn.ghost.sm', {
        type: 'button',
        onclick: async () => { await copyText('node server/server.js'); toast('Copied'); },
      }, icon('copy'), 'Copy command'),
      h('button.btn.ghost.sm', {
        type: 'button',
        onclick: () => { input.value = 'http://localhost:8787'; },
      }, 'Use localhost'),
    ),
  ));

  wrap.appendChild(h('p.hint', { style: { marginTop: '1rem' } },
    'Anyone you give the address to joins the same community. There are no accounts: your display name and a random device id identify you, so keep the address with people you trust.'));
}
