<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn — Bible, Prayer &amp; Community</title>
<meta name="description" content="Cairn — a free Bible app with 150+ translations, guided prayer, testimonies and community groups. Works on iOS, Android and PC.">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cairn">



<style>
/* ============================================================
   Cairn — styles
   Theme tokens -> readability controls -> layout -> components
   ============================================================ */

:root {
  /* readability knobs, driven by Settings (js/views/you.js) */
  --read-size: 19px;
  --read-leading: 1.75;
  --read-measure: 38rem;
  --read-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --read-spacing: 0em;
  --read-word: normal;

  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* one radius scale: pill for actions, sm for controls, md for surfaces */
  --radius: 14px;
  --radius-sm: 10px;
  --pill: 999px;
  --shadow: 0 1px 2px rgba(16, 20, 32, .06), 0 8px 24px rgba(16, 20, 32, .07);
  --shadow-sm: 0 1px 2px rgba(16, 20, 32, .08);
  --tap: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

/* ---------- themes ---------- */
html[data-theme="light"] {
  --bg: #f7f7f5;  --surface: #ffffff;  --surface-2: #f1f1ee;
  --text: #15171c; --text-dim: #5b6271; --text-faint: #8a91a0;
  --line: #e3e3de; --line-strong: #cfcfc8;
  --accent: #2f5d50; --accent-text: #ffffff; --accent-soft: #e6efeb;
  --gold: #9a7b28; --gold-soft: #f6efdd;
  --danger: #a5342b; --danger-soft: #fae9e7;
  --mark: #fdf0b8;
}
html[data-theme="sepia"] {
  --bg: #f3e9d7;  --surface: #fbf4e6;  --surface-2: #ecdfc8;
  --text: #37302a; --text-dim: #6c6055; --text-faint: #91836f;
  --line: #ddcdb0; --line-strong: #c9b48f;
  --accent: #6a4a2a; --accent-text: #fdf7ea; --accent-soft: #eadfc6;
  --gold: #8a6a1f; --gold-soft: #f0e3c2;
  --danger: #8e3b2b; --danger-soft: #eedbd3;
  --mark: #f2dc9a;
}
html[data-theme="dark"] {
  --bg: #101314;  --surface: #171b1c;  --surface-2: #1f2425;
  --text: #e7e6e2; --text-dim: #a3a8a5; --text-faint: #767b79;
  --line: #262b2c; --line-strong: #3a4042;
  --accent: #7fc0ab; --accent-text: #0f1115; --accent-soft: #1f2e2a;
  --gold: #d9b662; --gold-soft: #2b2619;
  --danger: #e98a7f; --danger-soft: #30211f;
  --mark: #4a431f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.45);
}
html[data-theme="night"] {
  --bg: #000000;  --surface: #0a0b0d;  --surface-2: #141518;
  --text: #b9b3a6; --text-dim: #857f74; --text-faint: #635e56;
  --line: #1c1d20; --line-strong: #2c2e33;
  --accent: #8a8070; --accent-text: #000000; --accent-soft: #15161a;
  --gold: #9a8a63; --gold-soft: #14130f;
  --danger: #a4675d; --danger-soft: #1a1210;
  --mark: #2a2616;
  --shadow: none; --shadow-sm: none;
}
html[data-theme="contrast"] {
  --bg: #000000;  --surface: #000000;  --surface-2: #101010;
  --text: #ffffff; --text-dim: #e8e8e8; --text-faint: #c8c8c8;
  --line: #ffffff; --line-strong: #ffffff;
  --accent: #ffe14d; --accent-text: #000000; --accent-soft: #241f00;
  --gold: #ffe14d; --gold-soft: #241f00;
  --danger: #ff8a7a; --danger-soft: #2a0d08;
  --mark: #3a3400;
  --shadow: none; --shadow-sm: none;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
/* Components below set `display`, which would otherwise beat the UA's
   `[hidden] { display: none }` and leave hidden elements on screen. */
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg[data-fill] { fill: currentColor; stroke: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; top: -100px; left: 8px; z-index: 200;
  background: var(--accent); color: var(--accent-text);
  padding: .6rem 1rem; border-radius: var(--radius-sm);
}
.skip-link:focus { top: calc(var(--safe-t) + 8px); }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: var(--radius-sm); }

/* ---------- splash ---------- */
.splash {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg); color: var(--text);
  display: grid; place-content: center; justify-items: center; gap: .5rem;
  text-align: center; padding: 2rem;
  transition: opacity .35s ease, visibility .35s ease;
}
.splash[hidden] { display: grid !important; opacity: 0; visibility: hidden; pointer-events: none; }
.splash[hidden] * { pointer-events: none; }
.splash-mark { color: var(--text-dim); }
.splash-mark .cap { fill: var(--gold); }
.splash-name { font-size: 1.35rem; font-weight: 700; letter-spacing: .02em; }
.splash-verse { color: var(--text-dim); font-size: .9rem; max-width: 22rem; font-style: italic; }
.splash-bar { width: 140px; height: 3px; background: var(--line); border-radius: var(--pill); overflow: hidden; margin-top: .75rem; }
.splash-bar span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: var(--pill); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: .4rem;
  padding: calc(var(--safe-t) + .5rem) .65rem .5rem;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-bottom: 1px solid var(--line);
  min-height: calc(var(--safe-t) + 52px);
}
.topbar-title {
  font-size: 1.05rem; font-weight: 680; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding-inline-start: .25rem;
}
.topbar-actions { display: flex; align-items: center; gap: .25rem; flex-shrink: 0; }

.iconbtn {
  display: inline-grid; place-items: center;
  width: var(--tap); height: var(--tap);
  background: none; border: 0; border-radius: 50%; color: var(--text);
  flex-shrink: 0;
}
.iconbtn svg { width: 22px; height: 22px; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.iconbtn.sm { width: 36px; height: 36px; }
.iconbtn.sm svg { width: 18px; height: 18px; }

/* ---------- layout ---------- */
.main {
  padding-bottom: calc(68px + var(--safe-b) + 1rem);
  min-height: 60vh;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 1rem .9rem 2rem; }
.wrap.narrow { max-width: 34rem; }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(160%) blur(12px);
  -webkit-backdrop-filter: saturate(160%) blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tab {
  display: grid; justify-items: center; gap: 2px;
  padding: .5rem .2rem .45rem;
  color: var(--text-faint); font-size: .66rem; font-weight: 600;
  letter-spacing: .01em; min-height: 56px; align-content: center;
}
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.1; }

/* ---------- generic components ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1rem;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: .7rem; }
.card-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
.card-head h2, .card-head h3 { font-size: .98rem; flex: 1; min-width: 0; }

.section-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-faint); margin: 1.4rem 0 .55rem;
}
.section-label:first-child { margin-top: .2rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  min-height: var(--tap); padding: .6rem 1.1rem;
  background: var(--accent); color: var(--accent-text);
  border: 1px solid transparent; border-radius: var(--pill);
  font-weight: 620; font-size: .94rem; text-align: center;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.985); }
.btn svg { width: 18px; height: 18px; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.soft:hover { filter: none; background: color-mix(in srgb, var(--accent-soft) 80%, var(--accent) 12%); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { min-height: 36px; padding: .35rem .8rem; font-size: .84rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.btn-row.end { justify-content: flex-end; }

.chip {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .36rem .72rem; border-radius: var(--pill);
  background: var(--surface-2); color: var(--text-dim);
  border: 1px solid transparent; font-size: .82rem; font-weight: 580;
  white-space: nowrap;
}
.chip[aria-pressed="true"], .chip.on { background: var(--accent); color: var(--accent-text); }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chips.scroll {
  flex-wrap: nowrap; overflow-x: auto; padding-bottom: .3rem;
  scrollbar-width: none; -ms-overflow-style: none;
}
.chips.scroll::-webkit-scrollbar { display: none; }

.pill {
  display: inline-block; padding: .18rem .5rem; border-radius: var(--pill);
  font-size: .7rem; font-weight: 700; letter-spacing: .03em;
  background: var(--surface-2); color: var(--text-dim);
}
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

label.field { display: block; margin-bottom: .8rem; }
label.field > span.lab {
  display: block; font-size: .8rem; font-weight: 650; color: var(--text-dim);
  margin-bottom: .3rem;
}
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; padding: .68rem .8rem;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  min-height: var(--tap);
}
textarea { min-height: 7rem; resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
select { appearance: none; background-image: none; padding-right: 2rem; }
.select-wrap { position: relative; }
.select-wrap::after {
  content: ""; position: absolute; right: .9rem; top: 50%;
  width: 8px; height: 8px; border-right: 2px solid var(--text-faint);
  border-bottom: 2px solid var(--text-faint); transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.hint { font-size: .78rem; color: var(--text-faint); margin-top: .3rem; line-height: 1.45; }

input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; min-height: 28px; padding: 0; border: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--line-strong); border-radius: var(--pill); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
input[type="range"]::-moz-range-track { height: 4px; background: var(--line-strong); border-radius: var(--pill); }
input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }

.switch { display: flex; align-items: center; gap: .75rem; min-height: var(--tap); }
.switch > span.lab { flex: 1; font-size: .92rem; }
.switch > span.lab small { display: block; color: var(--text-faint); font-size: .76rem; font-weight: 400; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; flex-shrink: 0; margin: 0; border-radius: var(--pill); background: var(--line-strong); border: 0; position: relative; transition: background .18s; min-height: 0; padding: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(18px); }

.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: .75rem; width: 100%;
  padding: .8rem .9rem; background: none; border: 0; border-bottom: 1px solid var(--line);
  text-align: left; min-height: var(--tap); color: var(--text);
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row-body { flex: 1; min-width: 0; }
/* these are <span>s inside .row-body, so they need to stack explicitly --
   left inline they run together as "John 3KJV - just now" */
.row-title { display: block; font-size: .93rem; font-weight: 600; line-height: 1.35; }
.row-sub { display: block; font-size: .78rem; color: var(--text-faint); margin-top: 2px; line-height: 1.35; }
.row-chev { color: var(--text-faint); }
.row-chev svg { width: 18px; height: 18px; }

.empty { text-align: center; padding: 2.4rem 1.2rem; color: var(--text-dim); }
.empty svg { width: 40px; height: 40px; color: var(--text-faint); margin-bottom: .6rem; }
.empty h3 { font-size: 1rem; margin-bottom: .3rem; color: var(--text); }
.empty p { font-size: .87rem; max-width: 24rem; margin: 0 auto .9rem; line-height: 1.5; }

.spinner { display: grid; place-items: center; padding: 2.6rem 1rem; }
.spinner::after {
  content: ""; width: 26px; height: 26px; border-radius: 50%;
  border: 2.5px solid var(--line-strong); border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skel { background: var(--surface-2); border-radius: var(--radius-sm); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

.banner {
  display: flex; gap: .6rem; align-items: flex-start;
  padding: .7rem .85rem; border-radius: var(--radius-sm);
  background: var(--gold-soft); color: var(--text);
  font-size: .83rem; line-height: 1.5; margin-bottom: .9rem;
  border: 1px solid color-mix(in srgb, var(--gold) 25%, transparent);
}
.card + .banner, .rows + .banner { margin-top: .7rem; }

/* one quiet line instead of a paragraph-sized banner on three screens */
.note {
  display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  font-size: .78rem; color: var(--text-dim); line-height: 1.4;
  padding: .5rem .8rem; background: var(--surface-2);
  border-radius: var(--pill); margin-bottom: .9rem;
}
.note > span { flex: 1; min-width: 0; }
.note button {
  background: none; border: 0; padding: 0; flex-shrink: 0;
  color: var(--accent); font-weight: 680; font-size: .78rem;
}
.note button:hover { text-decoration: underline; }
.banner svg { width: 18px; height: 18px; color: var(--gold); flex-shrink: 0; margin-top: 1px; }
.banner.err { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 28%, transparent); }
.banner.err svg { color: var(--danger); }

/* ---------- toasts ---------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(72px + var(--safe-b)); z-index: 300;
  display: grid; gap: .4rem; width: min(26rem, calc(100vw - 1.6rem));
  pointer-events: none;
}
.toast {
  background: var(--text); color: var(--bg);
  padding: .65rem .9rem; border-radius: var(--radius-sm);
  font-size: .87rem; box-shadow: var(--shadow);
  animation: toastIn .22s ease;
}
.toast.err { background: var(--danger); color: #fff; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------- sheet / modal ---------- */
.sheet-back {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(8, 10, 16, .5);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .18s ease;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--surface); width: min(34rem, 100%);
  border-radius: calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0;
  max-height: 88dvh; display: flex; flex-direction: column;
  animation: up .24s cubic-bezier(.2,.8,.3,1);
  padding-bottom: var(--safe-b);
}
@keyframes up { from { transform: translateY(14%); } }
.sheet-head {
  display: flex; align-items: center; gap: .5rem;
  padding: .85rem .5rem .6rem .95rem; border-bottom: 1px solid var(--line);
}
.sheet-head h2 { font-size: 1rem; flex: 1; }
.sheet-body { overflow-y: auto; padding: .95rem; -webkit-overflow-scrolling: touch; }
.sheet-foot { padding: .75rem .95rem; border-top: 1px solid var(--line); display: flex; gap: .5rem; }
.sheet-foot .btn { flex: 1; }
@media (min-width: 600px) {
  .sheet-back { align-items: center; }
  .sheet { border-radius: calc(var(--radius) + 4px); max-height: 84dvh; }
}

/* ============================================================
   READER
   ============================================================ */
.reader-bar {
  display: flex; gap: .4rem; align-items: center;
  padding: .5rem .9rem; max-width: 44rem; margin: 0 auto;
}
.ref-btn {
  /* Used both inside .reader-bar (as a flex item) and standalone on the
     Offline screen. `flex: 1` does nothing outside a flex row, so the width
     cap and min-width:0 are what stop a long translation name from pushing
     the whole page sideways. */
  flex: 1 1 auto;
  width: 100%; max-width: 100%; min-width: 0;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  min-height: 40px; padding: .4rem .8rem;
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--pill); font-weight: 640; font-size: .92rem; color: var(--text);
  overflow: hidden;
}
.ref-btn > span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.ref-btn > svg { flex: 0 0 auto; }
.ref-btn svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-faint); }
.tr-btn {
  /* never let the reference button squeeze this one to an ellipsis */
  flex: 0 0 auto;
  min-height: 40px; padding: .4rem .75rem;
  background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
  border-radius: var(--pill); font-weight: 700; font-size: .85rem; max-width: 9rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.chapter {
  max-width: var(--read-measure); margin: 0 auto;
  padding: .4rem 1.1rem 3rem;
  font-family: var(--read-family);
  font-size: var(--read-size);
  line-height: var(--read-leading);
  letter-spacing: var(--read-spacing);
  word-spacing: var(--read-word);
  color: var(--text);
}
.chapter-head { text-align: center; margin: .8rem 0 1.4rem; }
.chapter-book { font-family: var(--ui); font-size: .74rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--text-faint); }
.chapter-num { font-size: 2.1em; font-weight: 600; line-height: 1.1; margin-top: .1rem; }
.chapter-tr { font-family: var(--ui); font-size: .72rem; color: var(--text-faint); margin-top: .25rem; }

.verse { display: block; padding: .08em .2em; margin: 0 -.2em; border-radius: var(--radius-sm); scroll-margin-top: 110px; }
.chapter[data-layout="prose"] .verse { display: inline; }
.chapter[data-layout="prose"] { text-align: justify; hyphens: auto; }
.chapter[data-layout="lines"] .verse { margin-bottom: .45em; }
.verse-num {
  font-family: var(--ui); font-size: .62em; font-weight: 700;
  color: var(--accent); vertical-align: .35em; margin-right: .3em;
  user-select: none;
}
.chapter[data-numbers="off"] .verse-num { display: none; }
.verse.sel { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent) inset; }
.verse.speaking { background: var(--accent-soft); }
.verse[data-hl="yellow"] { background: #fdf0b8; color: #15171c; }
.verse[data-hl="green"]  { background: #cfead5; color: #15171c; }
.verse[data-hl="blue"]   { background: #d2e4f7; color: #15171c; }
.verse[data-hl="pink"]   { background: #f8d9e4; color: #15171c; }
.verse[data-hl="orange"] { background: #fbdcc0; color: #15171c; }
.verse[data-hl="underline"] { background: none; text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: .18em; }
.verse-note {
  display: inline-grid; place-items: center; width: 1.05em; height: 1.05em;
  vertical-align: .25em; margin-left: .25em; border-radius: 50%;
  background: var(--gold-soft); color: var(--gold);
}
.verse-note svg { width: .72em; height: .72em; stroke-width: 2.4; }
.strongs { font-family: var(--ui); font-size: .58em; color: var(--text-faint); vertical-align: .4em; margin: 0 .08em; }
.chapter[data-strongs="off"] .strongs { display: none; }
.jesus { color: var(--danger); }
.chapter[data-words-of-jesus="off"] .jesus { color: inherit; }

.chapter-nav { display: flex; gap: .6rem; max-width: var(--read-measure); margin: 0 auto; padding: 0 1.1rem 1rem; }
.chapter-nav .btn { flex: 1; }

/* parallel / compare */
.parallel { max-width: 62rem; margin: 0 auto; padding: .4rem .7rem 3rem; display: grid; gap: .8rem; }
@media (min-width: 740px) { .parallel.cols-2 { grid-template-columns: 1fr 1fr; } .parallel.cols-3 { grid-template-columns: repeat(3, 1fr); } }
.parallel-col { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.parallel-col > header { padding: .6rem .8rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: .4rem; background: var(--surface-2); }
.parallel-col > header strong { font-size: .8rem; }
.parallel-col > header small { font-size: .7rem; color: var(--text-faint); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.parallel-col .chapter { padding: .9rem; max-width: none; font-size: calc(var(--read-size) * .92); }

/* verse action sheet */
.hl-swatches { display: flex; gap: .55rem; flex-wrap: wrap; margin-bottom: .3rem; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line-strong); }
.swatch[data-c="yellow"] { background: #fdf0b8; }
.swatch[data-c="green"] { background: #cfead5; }
.swatch[data-c="blue"] { background: #d2e4f7; }
.swatch[data-c="pink"] { background: #f8d9e4; }
.swatch[data-c="orange"] { background: #fbdcc0; }
.swatch[data-c="underline"] { background: var(--surface-2); position: relative; }
.swatch[data-c="underline"]::after { content: "U"; position: absolute; inset: 0; display: grid; place-items: center; font-size: .8rem; font-weight: 700; text-decoration: underline; color: var(--text-dim); }
.swatch[data-c="none"] { background: var(--surface-2); position: relative; }
.swatch[data-c="none"]::after { content: ""; position: absolute; inset: 11px 3px; border-top: 2px solid var(--danger); transform: rotate(-45deg); }
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.verse-preview {
  font-family: var(--read-family); font-size: .95rem; line-height: 1.6;
  background: var(--surface-2); padding: .7rem .8rem; border-radius: var(--radius-sm);
  margin-bottom: .9rem; max-height: 8rem; overflow-y: auto;
}

/* book / chapter picker */
.picker-tabs { display: flex; gap: .3rem; padding: 0 .95rem .6rem; }
.picker-tabs .chip { flex: 1; justify-content: center; }
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .4rem; }
.book-grid button {
  padding: .6rem .5rem; background: var(--surface-2); border: 1px solid transparent;
  border-radius: var(--radius-sm); font-size: .84rem; font-weight: 580; text-align: left;
  min-height: 42px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.book-grid button.on { background: var(--accent); color: var(--accent-text); }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(3rem, 1fr)); gap: .4rem; }
.ch-grid button {
  aspect-ratio: 1; display: grid; place-items: center; min-height: 44px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: var(--radius-sm);
  font-weight: 620; font-size: .9rem; color: var(--text);
}
.ch-grid button.on { background: var(--accent); color: var(--accent-text); }

/* translation picker */
.tr-list { display: grid; gap: .3rem; }
.tr-item {
  display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left;
  padding: .6rem .7rem; background: var(--surface-2); border: 1px solid transparent;
  border-radius: var(--radius-sm); color: var(--text); min-height: 46px;
}
.tr-item.on { background: var(--accent-soft); border-color: var(--accent); }
.tr-item .tid { font-weight: 750; font-size: .82rem; min-width: 4.1rem; color: var(--accent); }
.tr-item .tname { flex: 1; min-width: 0; font-size: .83rem; line-height: 1.35; }
.tr-item .tname small { display: block; color: var(--text-faint); font-size: .72rem; }
.tr-item .tick { color: var(--accent); }
.tr-item .tick svg { width: 18px; height: 18px; stroke-width: 2.6; }
.tr-count { font-size: .78rem; color: var(--text-faint); padding: .2rem 0 .6rem; }

/* search */
.search-head { padding: .2rem 0 .8rem; display: grid; gap: .5rem; }
.search-row { display: flex; gap: .4rem; }
.search-row input { flex: 1; }
.result {
  display: block; width: 100%; text-align: left; padding: .8rem .9rem;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); color: var(--text); margin-bottom: .5rem;
}
.result:hover { border-color: var(--accent); }
.result-ref { font-size: .76rem; font-weight: 750; color: var(--accent); letter-spacing: .02em; }
.result-text { font-family: var(--read-family); font-size: .95rem; line-height: 1.55; margin-top: .25rem; }
.result-text mark { background: var(--mark); color: inherit; padding: 0 .1em; border-radius: var(--radius-sm); }

/* ============================================================
   PRAYER
   ============================================================ */
.streak-card { display: flex; align-items: center; gap: 1rem; }
.streak-ring {
  --pct: 0;
  width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%;
  background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--surface-2) 0);
  display: grid; place-items: center; position: relative;
}
.streak-ring::after { content: ""; position: absolute; inset: 7px; background: var(--surface); border-radius: 50%; }
.streak-ring b { position: relative; z-index: 1; font-size: 1.3rem; line-height: 1; }
.streak-ring b small { display: block; font-size: .56rem; font-weight: 600; letter-spacing: .08em; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

.goal {
  display: flex; align-items: flex-start; gap: .7rem; padding: .85rem .9rem;
  border-bottom: 1px solid var(--line);
}
.goal:last-child { border-bottom: 0; }
.goal-check {
  width: 28px; height: 28px; flex-shrink: 0; margin-top: 1px;
  border-radius: 50%; border: 2px solid var(--line-strong);
  background: none; display: grid; place-items: center; color: transparent;
}
.goal-check svg { width: 15px; height: 15px; stroke-width: 3; }
.goal-check.done { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.goal-body { flex: 1; min-width: 0; }
.goal-title { font-size: .93rem; font-weight: 620; line-height: 1.35; }
.goal.done .goal-title { color: var(--text-faint); text-decoration: line-through; }
.goal-meta { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .3rem; }
.goal-meta .pill { font-size: .66rem; }
.goal-note { font-size: .8rem; color: var(--text-dim); margin-top: .3rem; line-height: 1.45; }

.prayer-out {
  font-family: var(--read-family); font-size: 1.02rem; line-height: 1.8;
  white-space: pre-wrap;
}
.prayer-out .amen { display: block; margin-top: .9rem; font-weight: 700; letter-spacing: .04em; }
.prayer-scripture {
  margin-top: 1rem; padding: .8rem .9rem; border-left: 3px solid var(--gold);
  background: var(--gold-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-family: var(--read-family); font-size: .92rem; line-height: 1.6;
}
.prayer-scripture b { display: block; font-family: var(--ui); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); margin-bottom: .25rem; }

.wizard-step { animation: fadeUp .22s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }
.wizard-progress { display: flex; gap: 4px; margin-bottom: 1.1rem; }
.wizard-progress i { flex: 1; height: 3px; border-radius: var(--pill); background: var(--line); }
.wizard-progress i.on { background: var(--accent); }
.wizard-q { font-size: 1.12rem; font-weight: 680; line-height: 1.35; margin-bottom: .35rem; }
.wizard-help { font-size: .84rem; color: var(--text-dim); margin-bottom: 1rem; line-height: 1.5; }
.opt-list { display: grid; gap: .45rem; margin-bottom: 1rem; }
.opt {
  display: flex; align-items: center; gap: .7rem; text-align: left; width: 100%;
  padding: .75rem .85rem; background: var(--surface); color: var(--text);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); min-height: var(--tap);
}
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt-box {
  width: 22px; height: 22px; flex-shrink: 0; border-radius: var(--radius-sm);
  border: 2px solid var(--line-strong); display: grid; place-items: center; color: transparent;
}
.opt.on .opt-box { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.opt-box svg { width: 13px; height: 13px; stroke-width: 3.2; }
.opt-text { flex: 1; font-size: .92rem; line-height: 1.4; }
.opt-text small { display: block; color: var(--text-faint); font-size: .76rem; margin-top: 1px; }
.opt.radio .opt-box { border-radius: 50%; }

/* ============================================================
   STORIES & COMMUNITY
   ============================================================ */
.story { padding: 1rem; }
.story-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .55rem; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-weight: 700; font-size: .85rem;
  background: var(--accent-soft); color: var(--accent);
}
.avatar.lg { width: 56px; height: 56px; font-size: 1.2rem; }
.story-who { flex: 1; min-width: 0; }
.story-name { font-size: .87rem; font-weight: 650; }
.story-when { font-size: .74rem; color: var(--text-faint); }
.story-title { font-size: 1.02rem; font-weight: 680; line-height: 1.35; margin-bottom: .35rem; }
.story-body { font-size: .93rem; line-height: 1.65; color: var(--text-dim); white-space: pre-wrap; }
.story-body.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.story-verse { font-family: var(--read-family); font-size: .88rem; color: var(--text-dim); font-style: italic; margin-top: .6rem; padding-left: .7rem; border-left: 2px solid var(--gold); }
.story-foot { display: flex; align-items: center; gap: .3rem; margin-top: .75rem; padding-top: .6rem; border-top: 1px solid var(--line); }
.actbtn {
  display: inline-flex; align-items: center; gap: .3rem; padding: .35rem .6rem;
  background: none; border: 0; border-radius: var(--pill); color: var(--text-faint);
  font-size: .8rem; font-weight: 600; min-height: 36px;
}
.actbtn svg { width: 17px; height: 17px; }
.actbtn:hover { background: var(--surface-2); color: var(--text); }
.actbtn.on { color: var(--gold); }
.actbtn.on svg { fill: currentColor; stroke: currentColor; }

.group {
  display: flex; align-items: flex-start; gap: .75rem; padding: .9rem;
  border-bottom: 1px solid var(--line); width: 100%; text-align: left;
  background: none; border-left: 0; border-right: 0; border-top: 0; color: var(--text);
}
.group:last-child { border-bottom: 0; }
.group-icon {
  width: 42px; height: 42px; border-radius: var(--radius-sm); flex-shrink: 0;
  display: grid; place-items: center; font-size: 1.15rem;
  background: var(--surface-2);
}
.group-body { flex: 1; min-width: 0; }
.group-name { display: block; font-size: .94rem; font-weight: 650; line-height: 1.35; }
.group-desc { display: block; font-size: .8rem; color: var(--text-dim); margin-top: .2rem; line-height: 1.45; }
.group-meta { font-size: .73rem; color: var(--text-faint); margin-top: .35rem; display: flex; gap: .5rem; flex-wrap: wrap; }

.thread { display: grid; gap: .6rem; padding-bottom: 1rem; }
.msg { display: flex; gap: .55rem; align-items: flex-end; }
.msg-bubble {
  background: var(--surface); border: 1px solid var(--line);
  padding: .55rem .75rem; border-radius: var(--radius) var(--radius) var(--radius) 4px;
  font-size: .9rem; line-height: 1.5; max-width: 80%; white-space: pre-wrap;
  box-shadow: var(--shadow-sm);
}
.msg-who { font-size: .72rem; font-weight: 700; color: var(--accent); margin-bottom: .15rem; }
.msg-when { font-size: .68rem; color: var(--text-faint); margin-top: .2rem; }
.msg.mine { flex-direction: row-reverse; }
.msg.mine .msg-bubble { background: var(--accent-soft); border-color: transparent; border-radius: var(--radius) var(--radius) 4px var(--radius); }
.msg.mine .msg-who { text-align: right; color: var(--text-faint); }
.composer {
  position: sticky; bottom: calc(68px + var(--safe-b)); z-index: 50;
  display: flex; gap: .5rem; align-items: flex-end;
  padding: .6rem .7rem; margin: 0 -.9rem;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.composer textarea { min-height: 44px; max-height: 8rem; resize: none; border-radius: var(--pill); padding: .6rem .9rem; }
.composer .iconbtn { background: var(--accent); color: var(--accent-text); }

/* ---------- prayer wall: a deck you work through, not a list ---------- */
.deck { position: relative; min-height: 17rem; margin: 1.1rem 0 .4rem; }
.deck-card {
  position: absolute; inset: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.3rem 1.2rem;
  display: flex; flex-direction: column; gap: .7rem;
  box-shadow: var(--shadow);
  transition: transform .3s cubic-bezier(.2,.8,.3,1), opacity .3s ease;
  will-change: transform;
}
.deck-card[data-depth="1"] { transform: translateY(9px) scale(.965); opacity: .72; }
.deck-card[data-depth="2"] { transform: translateY(18px) scale(.93); opacity: .4; }
.deck-card[data-depth="1"], .deck-card[data-depth="2"] { pointer-events: none; }
.deck-card.gone-left  { transform: translateX(-125%) rotate(-7deg); opacity: 0; }
.deck-card.gone-right { transform: translateX(125%) rotate(7deg); opacity: 0; }
.deck-who { display: flex; align-items: center; gap: .55rem; }
.deck-text {
  flex: 1; font-family: var(--read-family);
  font-size: 1.12rem; line-height: 1.62; white-space: pre-wrap;
  overflow-y: auto;
}
.deck-meta { font-size: .73rem; color: var(--text-faint); }
.deck-acts { display: flex; gap: .6rem; margin-top: .6rem; }
.deck-acts .btn { flex: 1; }
.deck-count {
  text-align: center; font-size: .74rem; color: var(--text-faint);
  letter-spacing: .06em; text-transform: uppercase; font-weight: 700;
}
@media (prefers-reduced-motion: reduce) { .deck-card { transition: none; } }

/* ---------- read-aloud player ---------- */
.player {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(68px + var(--safe-b) + .5rem); z-index: 80;
  width: min(32rem, calc(100vw - 1.2rem));
  display: flex; align-items: center; gap: .5rem;

  background: var(--surface); border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
}

.player-rate { width: 68px; flex-shrink: 0; }

/* ---------- home: the verse is the hero, not a card ---------- */
.today { padding: .6rem 0 1.6rem; }
.today-greet {
  font-size: .72rem; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 1rem;
}
.today-verse {
  font-family: var(--read-family);
  font-size: 1.32rem; line-height: 1.62; color: var(--text);
  text-wrap: pretty;
}

  font-family: var(--ui); font-size: .76rem; font-weight: 700;
  letter-spacing: .04em; color: var(--accent); margin-top: .9rem;
}
.today-acts { display: flex; align-items: center; gap: .2rem; margin-top: 1rem; }
@media (min-width: 640px) { .today-verse { font-size: 1.5rem; } }

/* ---------- you / settings ---------- */
.preview-box {
  font-family: var(--read-family); font-size: var(--read-size);
  line-height: var(--read-leading); letter-spacing: var(--read-spacing);
  word-spacing: var(--read-word);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem;
}
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .5rem; }
.theme-sw {
  padding: .6rem .4rem; border-radius: var(--radius-sm); border: 2px solid var(--line);
  font-size: .74rem; font-weight: 650; text-align: center;
}
.theme-sw.on { border-color: var(--accent); }
.theme-sw i { display: block; height: 26px; border-radius: var(--radius-sm); margin-bottom: .35rem; border: 1px solid rgba(128,128,128,.3); }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: .5rem; }

/* the trail: one square per day, filled when you showed up */
.trail-head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .9rem; }
.trail-head b { font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.trail-head span { font-size: .84rem; color: var(--text-dim); line-height: 1.3; }
.trail-scroll { overflow-x: auto; padding-bottom: .3rem; scrollbar-width: none; }
.trail-scroll::-webkit-scrollbar { display: none; }
.trail {
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr);
  gap: 3px; width: max-content;
}
.trail i {
  width: 11px; height: 11px; border-radius: 2px;
  background: var(--surface-2); display: block;
}
.trail i[data-on="1"] { background: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); }
.trail i[data-on="2"] { background: var(--accent); }
.trail i[data-future="1"] { background: transparent; }
.trail-legend {
  display: flex; align-items: center; gap: .35rem; justify-content: flex-end;
  font-size: .7rem; color: var(--text-faint); margin-top: .5rem;
}
.trail-legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--surface-2); display: block; }
.trail-legend i[data-on="1"] { background: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); }
.trail-legend i[data-on="2"] { background: var(--accent); }
.trail-foot { display: flex; gap: 1.4rem; margin-top: 1rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.trail-foot div { font-size: .78rem; color: var(--text-faint); }
.trail-foot b { display: block; font-size: 1.05rem; color: var(--text); font-variant-numeric: tabular-nums; }
.stat { background: var(--surface-2); border-radius: var(--radius-sm); padding: .7rem .5rem; text-align: center; }
.stat b { display: block; font-size: 1.3rem; line-height: 1.1; }
.stat span { font-size: .7rem; color: var(--text-faint); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
@media print {
  .topbar, .tabbar, .player, .reader-bar, .chapter-nav, .toasts { display: none !important; }
  .chapter { max-width: none; }
  body { background: #fff; color: #000; }
}

  // The reader is the product, so the bar stays out of its way: search, and
  // everything else one tap down.
  setTopbar({
    title: 'Read',
    actions: [
      { icon: 'search', label: 'Search the Bible', onClick: () => navigate('/search') },
      { icon: 'sliders', label: 'Reading options', onClick: openReaderMenu, pressed: state.parallel.length > 0 },
    ],
  });

  await loadChapter(body);
}

/** Compare, listen and reading comfort, one tap below the reader. */
function openReaderMenu() {
  sheet({
    title: B.refString(state.translation, state.book, state.chapter),
    body: (body, api) => {
      const rows = h('div.rows');
      rows.append(
        actionRow('speaker', 'Listen to this chapter', () => { api.close(); readChapterAloud(); }),
        actionRow('layers', state.parallel.length
          ? `Comparing with ${state.parallel.join(', ')}`
          : 'Compare translations side by side', () => { api.close(); openParallelPicker(); }),
        actionRow('type', 'Reading comfort', () => { api.close(); openReadabilitySheet(); }),
        actionRow('search', 'Search the Bible', () => { api.close(); navigate('/search'); }),
        actionRow('bookmark', 'Highlights & notes', () => { api.close(); navigate('/you/marks'); }),
      );
      body.appendChild(rows);
    },
  });
}

function buildBar() {
  const refBtn = h('button.ref-btn', {
    type: 'button', id: 'ref-btn', 'aria-label': 'Choose book and chapter',
    onclick: openBookPicker,
  }, h('span', { id: 'ref-label' }, B.refString(state.translation, state.book, state.chapter)), icon('chevDown'));

  const trBtn = h('button.tr-btn', {
    type: 'button', id: 'tr-btn', 'aria-label': 'Choose translation',
    onclick: openTranslationPicker,
  }, state.translation);

  return h('div.reader-bar', null, refBtn, trBtn);
}

function syncBar() {
  const l = $('#ref-label');
  if (l) l.textContent = B.refString(state.translation, state.book, state.chapter);
  const t = $('#tr-btn');
  if (t) t.textContent = state.translation;
}

/* ============================================================
   Chapter loading & rendering
   ============================================================ */

let loadToken = 0;

async function loadChapter(host = $('#reader-body')) {
  if (!host) return;
  const token = ++loadToken;
  host.innerHTML = '';
  host.appendChild(spinner());
  syncBar();

  const ids = [state.translation, ...state.parallel];
  try {
    const results = await B.fetchParallel(ids, state.book, state.chapter);
    if (token !== loadToken) return;
    host.innerHTML = '';

    const primary = results[0];
    if (primary.error) {
      host.appendChild(h('div.wrap', null,
        banner(primary.error, 'err'),
        emptyState({
          iconName: 'cloudOff', title: 'Chapter unavailable',
          text: 'Check your connection and try again. Chapters you have opened before stay readable offline.',
          action: h('button.btn', { type: 'button', onclick: () => loadChapter() }, 'Try again'),
        }),
      ));
      return;
    }

    if (results.length > 1) host.appendChild(renderParallel(results));
    else host.appendChild(renderChapter(primary));

    host.appendChild(renderChapterNav());

    reading.visit(state.book, state.chapter, state.translation, B.bookName(state.translation, state.book));
    // Persist the translation too, not just the place. The reader can be
    // opened at a translation by link (a search result, a shared verse, a
    // prayer's scripture), and Search and Offline downloads read this value --
    // without it they would keep offering whichever translation was last
    // chosen from the picker.
    settings.set({
      translation: state.translation,
      lastRead: { book: state.book, chapter: state.chapter, translation: state.translation },
    });

    if (state.focusVerse) {
      requestAnimationFrame(() => {
        const el = host.querySelector(`[data-verse="${state.focusVerse}"]`);
        if (el) {
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          el.classList.add('sel');
          setTimeout(() => el.classList.remove('sel'), 2600);
        }
      });
    } else {
      window.scrollTo({ top: 0 });
    }
  } catch (err) {
    if (token !== loadToken) return;
    host.innerHTML = '';
    host.appendChild(h('div.wrap', null, banner(err.message || 'Something went wrong.', 'err')));
  }
}

function applyChapterFlags(el) {
  const s = settings.get();
  el.dataset.layout = s.layout;
  el.dataset.numbers = s.showVerseNumbers ? 'on' : 'off';
  el.dataset.strongs = s.showStrongs ? 'on' : 'off';
  el.dataset.wordsOfJesus = s.wordsOfJesus ? 'on' : 'off';
}

function renderChapter({ verses, id = state.translation, stale }) {
  const hl = marks.chapterHighlights(state.book, state.chapter);
  const notes = marks.chapterNotes(state.book, state.chapter);

  const wrap = h('article.chapter', { id: 'chapter-text', 'aria-label': B.refString(id, state.book, state.chapter) });
  applyChapterFlags(wrap);

  wrap.appendChild(h('header.chapter-head', null,
    h('p.chapter-book', null, B.bookName(id, state.book)),
    h('p.chapter-num', null, String(state.chapter)),
    h('p.chapter-tr', null, B.translationLabel(id)),
  ));

  if (stale) wrap.appendChild(banner('Showing the saved copy — you are offline.'));

  for (const v of verses) {
    wrap.appendChild(verseNode(v, { hl: hl[v.verse], note: notes[v.verse] }));
  }
  return wrap;
}

function verseNode(v, { hl, note } = {}) {
  const el = h('span.verse', {
    dataset: { verse: String(v.verse) },
    role: 'button', tabindex: '0',
    'aria-label': `Verse ${v.verse}`,
  });
  if (hl) el.dataset.hl = hl;
  el.appendChild(h('span.verse-num', { 'aria-hidden': 'true' }, String(v.verse)));
  const body = h('span.verse-body', { html: B.normaliseVerseHtml(v.text) });
  el.appendChild(body);
  if (note) {
    const n = h('span.verse-note', { title: 'You have a note here' }, icon('note'));
    el.appendChild(n);
  }
  el.appendChild(document.createTextNode(' '));

  const open = (e) => { e.preventDefault(); openVerseSheet(v); };
  el.addEventListener('click', open);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') open(e); });
  return el;
}

function renderParallel(results) {
  const cols = h('div.parallel' + (results.length === 3 ? '.cols-3' : '.cols-2'));
  for (const r of results) {
    const col = h('section.parallel-col');
    col.appendChild(h('header', null,
      h('strong', null, r.id),
      h('small', null, B.translationLabel(r.id)),
      r.id === state.translation ? null : h('button.iconbtn.sm', {
        type: 'button', 'aria-label': `Remove ${r.id} from comparison`,
        onclick: () => {
          state.parallel = state.parallel.filter((x) => x !== r.id);
          settings.set({ parallel: state.parallel });
          loadChapter();
        },
      }, icon('close')),
    ));
    if (r.error) {
      col.appendChild(h('div', { style: { padding: '1rem', fontSize: '.85rem', color: 'var(--text-faint)' } }, r.error));
    } else {
      const body = h('div.chapter');
      applyChapterFlags(body);
      const hl = r.id === state.translation ? marks.chapterHighlights(state.book, state.chapter) : {};
      for (const v of r.verses) body.appendChild(verseNode(v, { hl: hl[v.verse] }));
      col.appendChild(body);
    }
    cols.appendChild(col);
  }
  return cols;
}

function renderChapterNav() {
  const chapters = B.chapterCount(state.translation, state.book);
  const list = B.books(state.translation);
  const bi = list.findIndex((b) => b.id === state.book);

  const hasPrev = state.chapter > 1 || bi > 0;
  const hasNext = state.chapter < chapters || (bi > -1 && bi < list.length - 1);

  return h('nav.chapter-nav', { 'aria-label': 'Chapter navigation' },
    h('button.btn.ghost', { type: 'button', disabled: !hasPrev, onclick: () => step(-1) }, icon('back'), 'Previous'),
    h('button.btn.ghost', { type: 'button', disabled: !hasNext, onclick: () => step(1) }, 'Next', icon('chev')),
  );
}

function step(dir) {
  const list = B.books(state.translation);
  const chapters = B.chapterCount(state.translation, state.book);
  let { book, chapter } = state;

  if (dir > 0) {
    if (chapter < chapters) chapter += 1;
    else {
      const i = list.findIndex((b) => b.id === book);
      if (i > -1 && i < list.length - 1) { book = list[i + 1].id; chapter = 1; }
      else return;
    }
  } else {
    if (chapter > 1) chapter -= 1;
    else {
      const i = list.findIndex((b) => b.id === book);
      if (i > 0) { book = list[i - 1].id; chapter = B.chapterCount(state.translation, list[i - 1].id); }
      else return;
    }
  }
  state.book = book;
  state.chapter = chapter;
  state.focusVerse = null;
  loadChapter();
}

/* ============================================================
   Verse actions
   ============================================================ */

const HL_COLORS = ['yellow', 'green', 'blue', 'pink', 'orange', 'underline', 'none'];

function openVerseSheet(v) {
  const ref = B.refString(state.translation, state.book, state.chapter, v.verse);
  const plain = B.plainText(v.text);
  const existing = marks.getHighlight(state.book, state.chapter, v.verse);
  const note = marks.getNote(state.book, state.chapter, v.verse);

  sheet({
    title: ref,
    body: (body, api) => {
      body.appendChild(h('div.verse-preview', null, plain));

      body.appendChild(h('p.section-label', null, 'Highlight'));
      const swatches = h('div.hl-swatches');
      for (const c of HL_COLORS) {
        const btn = h('button.swatch' + (existing === c ? '.on' : ''), {
          type: 'button', dataset: { c }, 'aria-label': c === 'none' ? 'Remove highlight' : `Highlight ${c}`,
          onclick: () => {
            marks.highlight(state.book, state.chapter, v.verse, c);
            $$('.swatch', swatches).forEach((s) => s.classList.toggle('on', s.dataset.c === c));
            const el = $(`#reader-body [data-verse="${v.verse}"]`);
            if (el) { if (c === 'none') delete el.dataset.hl; else el.dataset.hl = c; }
            toast(c === 'none' ? 'Highlight removed' : 'Highlighted');
          },
        });
        swatches.appendChild(btn);
      }
      body.appendChild(swatches);

      body.appendChild(h('p.section-label', null, 'Note'));
      const ta = h('textarea', {
        placeholder: 'What is this verse saying to you?',
        value: note?.text || '',
        'aria-label': `Note on ${ref}`,
      });
      body.appendChild(ta);
      body.appendChild(h('div.btn-row.end', { style: { marginTop: '.5rem' } },
        h('button.btn.soft.sm', {
          type: 'button',
          onclick: () => {
            marks.note(state.book, state.chapter, v.verse, ta.value);
            toast(ta.value.trim() ? 'Note saved' : 'Note removed');
            loadChapter();
            api.close();
          },
        }, 'Save note'),
      ));

      body.appendChild(h('p.section-label', null, 'More'));
      const rows = h('div.rows');
      const bookmarked = marks.isBookmarked(state.book, state.chapter, v.verse);
      rows.append(
        actionRow(bookmarked ? 'bookmark' : 'bookmark', bookmarked ? 'Remove bookmark' : 'Bookmark this verse', () => {
          const added = marks.toggleBookmark({
            book: state.book, chapter: state.chapter, verse: v.verse,
            translation: state.translation, text: plain,
            bookName: B.bookName(state.translation, state.book),
          });
          toast(added ? 'Bookmarked' : 'Bookmark removed');
          api.close();
        }),
        actionRow('copy', 'Copy verse', async () => {
          const ok = await copyText(`"${plain}"\n— ${ref} (${state.translation})`);
          toast(ok ? 'Copied' : 'Could not copy', ok ? '' : 'err');
          api.close();
        }),
        actionRow('share', 'Share verse', async () => {
          const res = await shareOrCopy({
            title: ref,
            text: `"${plain}"\n— ${ref} (${state.translation})`,
            url: location.origin + location.pathname + `#/read?book=${state.book}&chapter=${state.chapter}&verse=${v.verse}&tr=${state.translation}`,
          });
          if (res === 'copied') toast('Copied to clipboard');
          api.close();
        }),
        actionRow('speaker', 'Read aloud from here', () => { api.close(); readChapterAloud(v.verse); }),
        actionRow('layers', 'Compare in other translations', () => { api.close(); openCompareVerse(v.verse); }),
        actionRow('hands', 'Pray with this verse', () => {
          api.close();
          navigate(`/prayer/build?verse=${state.book}.${state.chapter}.${v.verse}`);
        }),
      );
      body.appendChild(rows);
    },
  });
}

function actionRow(iconName, label, onClick) {
  return h('button.row', { type: 'button', onclick: onClick },
    h('span', { style: { color: 'var(--text-dim)', display: 'grid' } }, icon(iconName)),
    h('span.row-body', null, h('span.row-title', null, label)),
    h('span.row-chev', null, icon('chev')),
  );
}

/** Side-by-side view of one verse in many translations. */
function openCompareVerse(verse) {
  const ref = B.refString(state.translation, state.book, state.chapter, verse);
  const s = settings.get();
  const picks = Array.from(new Set([state.translation, ...(s.parallel || []), 'KJV', 'NKJV', 'ESV', 'NIV2011', 'NLT', 'MSG', 'AMP', 'BSB', 'WEB', 'ERV']))
    .filter((id) => B.books(id).length)
    .slice(0, 12);

  sheet({
    title: `${ref} — compared`,
    wide: true,
    body: (body) => {
      body.appendChild(spinner());
      (async () => {
        const out = h('div');
        const results = await Promise.all(picks.map(async (id) => {
          try {
            const vs = await B.fetchVerses(id, state.book, state.chapter, verse);
            return { id, text: vs.length ? B.plainText(vs[0].text) : '' };
          } catch { return { id, text: '' }; }
        }));
        for (const r of results) {
          if (!r.text) continue;
          out.appendChild(h('div', { style: { marginBottom: '.9rem' } },
            h('p', { style: { fontSize: '.72rem', fontWeight: '750', color: 'var(--accent)', letterSpacing: '.04em' } },
              r.id, h('span', { style: { fontWeight: '400', color: 'var(--text-faint)', marginLeft: '.4rem' } }, B.translationLabel(r.id))),
            h('p', { style: { fontFamily: 'var(--read-family)', fontSize: '.95rem', lineHeight: '1.6', marginTop: '.15rem' } }, r.text),
          ));
        }
        if (!out.children.length) out.appendChild(banner('Could not load comparisons right now.', 'err'));
        body.innerHTML = '';
        body.appendChild(out);
      })();
    },
  });
}

/* ============================================================
   Read aloud
   ============================================================ */

async function readChapterAloud(fromVerse = null) {
  if (!tts.supported()) { toast('Read-aloud is not supported in this browser.', 'err'); return; }
  const s = settings.get();
  let verses;
  try {
    ({ verses } = await B.fetchChapter(state.translation, state.book, state.chapter));
  } catch (err) { toast(err.message, 'err'); return; }

  const items = verses
    .filter((v) => !fromVerse || v.verse >= fromVerse)
    .map((v) => ({
      id: String(v.verse),
      text: B.plainText(v.text),
      label: B.refString(state.translation, state.book, state.chapter, v.verse),
    }));

  const bookTitle = B.refString(state.translation, state.book, state.chapter);
  tts.speak(items, {
    rate: s.ttsRate, voice: s.ttsVoice,
    title: bookTitle, subtitle: B.translationLabel(state.translation),
    onItem: (item) => {
      $$('.verse.speaking').forEach((el) => el.classList.remove('speaking'));
      if (!item) return;
      const el = $(`#reader-body [data-verse="${item.id}"]`);
      if (el) {
        el.classList.add('speaking');
        const r = el.getBoundingClientRect();
        if (r.top < 90 || r.bottom > innerHeight - 160) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    },
    onEnd: () => $$('.verse.speaking').forEach((el) => el.classList.remove('speaking')),
  });
}

/* ============================================================
   Pickers
   ============================================================ */

function openBookPicker() {
  const list = B.books(state.translation);
  let mode = state.book > 39 ? (state.book > 66 ? 'extra' : 'nt') : 'ot';
  let selected = state.book;

  sheet({
    title: 'Books & chapters',
    body: (body, api) => {
      const tabs = h('div.picker-tabs');
      const grid = h('div');

      const hasExtra = list.some((b) => b.id > 66);
      const defs = [['ot', 'Old Testament'], ['nt', 'New Testament']];
      if (hasExtra) defs.push(['extra', 'Apocrypha']);

      for (const [id, label] of defs) {
        tabs.appendChild(h('button.chip', {
          type: 'button', dataset: { m: id }, 'aria-pressed': String(mode === id),
          onclick: () => { mode = id; paintBooks(); },
        }, label));
      }

      function paintBooks() {
        $$('[data-m]', tabs).forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.m === mode)));
        grid.innerHTML = '';
        const filtered = list.filter((b) => (mode === 'ot' ? b.id <= 39 : mode === 'nt' ? b.id > 39 && b.id <= 66 : b.id > 66));
        const g = h('div.book-grid');
        for (const b of filtered) {
          g.appendChild(h('button' + (b.id === selected ? '.on' : ''), {
            type: 'button', title: b.name,
            onclick: () => { selected = b.id; paintChapters(); },
          }, b.name));
        }
        grid.appendChild(g);
      }

      function paintChapters() {
        const b = list.find((x) => x.id === selected);
        if (!b) return;
        grid.innerHTML = '';
        grid.appendChild(h('div', { style: { display: 'flex', alignItems: 'center', gap: '.5rem', marginBottom: '.7rem' } },
          h('button.iconbtn.sm', { type: 'button', 'aria-label': 'Back to books', onclick: paintBooks }, icon('back')),
          h('strong', { style: { fontSize: '.95rem' } }, b.name),
          h('span.pill', null, `${b.chapters} ch.`),
        ));
        const g = h('div.ch-grid');
        for (let c = 1; c <= b.chapters; c += 1) {
          g.appendChild(h('button' + (selected === state.book && c === state.chapter ? '.on' : ''), {
            type: 'button',
            onclick: () => {
              state.book = selected;
              state.chapter = c;
              state.focusVerse = null;
              api.close();
              loadChapter();
            },
          }, String(c)));
        }
        grid.appendChild(g);
      }

      // quick reference search
      const quick = h('input', {
        type: 'search', placeholder: 'Jump to a reference — e.g. 1 Cor 13:4',
        'aria-label': 'Jump to a reference',
        style: { marginBottom: '.7rem' },
      });
      quick.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        // Without this, closing the sheet returns focus to the button that
        // opened it and the key's default action re-opens it immediately.
        e.preventDefault();
        const parsed = B.parseReference(quick.value);
        if (!parsed) { toast('Could not read that reference.', 'err'); return; }
        const okBook = list.some((b) => b.id === parsed.book);
        if (!okBook) { toast(`${B.bookName('KJV', parsed.book)} is not in ${state.translation}.`, 'err'); return; }
        state.book = parsed.book;
        state.chapter = Math.min(parsed.chapter, B.chapterCount(state.translation, parsed.book));
        state.focusVerse = parsed.verse;
        api.close();
        loadChapter();
      });

      body.append(quick, tabs, grid);
      // tabs live above the grid but outside .sheet-body padding rules
      paintBooks();
    },
  });
}

function openTranslationPicker() {
  const all = B.translations();
  let query = '';
  let lang = '';

  sheet({
    title: `Choose a translation — ${all.length} available`,
    body: (body, api) => {
      const input = h('input', {
        type: 'search', placeholder: 'Search 150+ translations or a language…',
        'aria-label': 'Search translations',
      });
      const langRow = h('div.chips.scroll', { style: { margin: '.6rem 0' } });
      const count = h('p.tr-count');
      const list = h('div.tr-list');

      const langs = Array.from(new Set(all.map((t) => t.lang)))
        .sort((a, b) => (a.startsWith('English') ? -1 : b.startsWith('English') ? 1 : a.localeCompare(b)));

      langRow.appendChild(h('button.chip', {
        type: 'button', dataset: { l: '' }, 'aria-pressed': 'true',
        onclick: () => { lang = ''; paint(); },
      }, 'All languages'));
      for (const l of langs) {
        langRow.appendChild(h('button.chip', {
          type: 'button', dataset: { l }, 'aria-pressed': 'false',
          onclick: () => { lang = l; paint(); },
        }, l.split(' ')[0]));
      }

      function paint() {
        $$('[data-l]', langRow).forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.l === lang)));
        const q = query.trim().toLowerCase();
        const rows = all.filter((t) => {
          if (lang && t.lang !== lang) return false;
          if (!q) return true;
          return t.id.toLowerCase().includes(q) || t.name.toLowerCase().includes(q) || t.lang.toLowerCase().includes(q);
        });
        count.textContent = `${rows.length} translation${rows.length === 1 ? '' : 's'}`;
        list.innerHTML = '';
        for (const t of rows.slice(0, 400)) {
          const on = t.id === state.translation;
          list.appendChild(h('button.tr-item' + (on ? '.on' : ''), {
            type: 'button',
            onclick: () => {
              state.translation = t.id;
              settings.set({ translation: t.id, parallel: (settings.get().parallel || []).filter((x) => x !== t.id) });
              state.parallel = settings.get().parallel.filter((x) => x !== t.id);
              const books = B.books(t.id);
              if (books.length && !books.some((b) => b.id === state.book)) {
                state.book = books[0].id;
                state.chapter = 1;
              } else {
                state.chapter = Math.min(state.chapter, B.chapterCount(t.id, state.book));
              }
              api.close();
              loadChapter();
            },
          },
            h('span.tid', null, t.id),
            h('span.tname', null, t.name, h('small', null, t.lang)),
            on ? h('span.tick', null, icon('check')) : null,
          ));
        }
        if (!rows.length) list.appendChild(emptyState({ iconName: 'search', title: 'No match', text: 'Try a different word, or pick a language above.' }));
      }

      input.addEventListener('input', debounce(() => { query = input.value; paint(); }, 160));
      body.append(input, langRow, count, list);
      paint();
    },
  });
}

function openParallelPicker() {
  const all = B.translations();
  let picks = [...state.parallel];
  let query = '';

  sheet({
    title: 'Compare side by side',
    body: (body, api) => {
      body.appendChild(banner(`Reading ${state.translation}. Add up to two more translations to read in parallel.`));
      const input = h('input', { type: 'search', placeholder: 'Search translations…', 'aria-label': 'Search translations' });
      const list = h('div.tr-list', { style: { marginTop: '.6rem' } });

      function paint() {
        const q = query.trim().toLowerCase();
        const rows = all
          .filter((t) => t.id !== state.translation)
          .filter((t) => !q || t.id.toLowerCase().includes(q) || t.name.toLowerCase().includes(q) || t.lang.toLowerCase().includes(q))
          .sort((a, b) => (picks.includes(b.id) ? 1 : 0) - (picks.includes(a.id) ? 1 : 0));
        list.innerHTML = '';
        for (const t of rows.slice(0, 200)) {
          const on = picks.includes(t.id);
          list.appendChild(h('button.tr-item' + (on ? '.on' : ''), {
            type: 'button',
            onclick: (e) => {
              if (on) picks = picks.filter((x) => x !== t.id);
              else if (picks.length >= 2) { toast('Two extra translations is the maximum.', 'err'); return; }
              else picks.push(t.id);
              paint();
            },
          },
            h('span.tid', null, t.id),
            h('span.tname', null, t.name, h('small', null, t.lang)),
            on ? h('span.tick', null, icon('check')) : null,
          ));
        }
      }
      input.addEventListener('input', debounce(() => { query = input.value; paint(); }, 160));
      body.append(input, list);

    box.appendChild(h('b', null, `${ref} · ${tr}`));

        onclick: () => navigate(`/read?book=${s.book}&chapter=${s.chapter}&verse=${s.verse}&tr=${tr}`),
      }, 'Open in the reader'),
    ));
    host.appendChild(box);

    B.fetchVerses(tr, s.book, s.chapter, s.verse, s.verseEnd || s.verse)
      .then((vs) => {
        textEl.textContent = vs.length
          ? vs.map((v) => B.plainText(v.text)).join(' ')

      .catch(() => { textEl.textContent = 'Could not load the verse text — tap below to open it in the reader.'; });
  }

    const byId = new Map(groups.map((g) => [g.id, g]));
    const merged = builtin.map((g) => {
      const remote = byId.get(g.id);
      byId.delete(g.id);
      return remote ? { ...g, members: remote.members, messages: remote.messages } : g;
    });
    for (const extra of byId.values()) {
      merged.push({ ...extra, builtin: false, joined: community.isJoined(extra.id) });
    }
    return merged;
  } catch {
    return builtin;
  }
}

async function createGroup({ name, desc, emoji = '💬', topics = [] }) {
  const id = 'c_' + uid();
  if (isServerMode()) {
    const { group } = await req('POST', '/api/groups', { id, name, desc, emoji, topics });
    community.join(group.id);
    return group;
  }
  const c = community.get();
  c.customGroups = c.customGroups || [];
  const group = { id, name, desc, emoji, topics, builtin: false, members: 1, messages: 0, createdAt: Date.now() };
  c.customGroups.push(group);
  community.save(c);
  community.join(id);
  return group;
}

function localCustomGroups() {
  return (community.get().customGroups || []).map((g) => ({ ...g, joined: community.isJoined(g.id) }));
}

  if (isServerMode()) { try { await req('POST', `/api/groups/${encodeURIComponent(groupId)}/join`); } catch { /* local join still stands */ } }
}

async function leaveGroup(groupId) {
  community.leave(groupId);
  if (isServerMode()) { try { await req('POST', `/api/groups/${encodeURIComponent(groupId)}/leave`); } catch { /* ignore */ } }
}

   MESSAGES
   ============================================================ */

async function listMessages(groupId, { since = 0 } = {}) {
  if (!isServerMode()) {
    return { messages: community.localMessages(groupId), local: true };
  }
  try {
    const data = await req('GET', `/api/groups/${encodeURIComponent(groupId)}/messages?since=${since}`);
    return { messages: data.messages || [], local: false };
  } catch (err) {
    return { messages: community.localMessages(groupId), local: true, error: err.message };
  }
}

async function sendMessage(groupId, text, { anon = false } = {}) {
  const me = profile.get();
  const msg = {
    id: 'm_' + uid(),
    groupId,
    userId: anon ? 'anon' : me.id,
    name: anon ? 'Anonymous' : (me.name || 'Friend'),
    text: String(text).trim(),
    createdAt: Date.now(),
    mine: true,
  };
  if (!msg.text) throw new Error('Nothing to send.');
  if (isServerMode()) {
    try {
      const data = await req('POST', `/api/groups/${encodeURIComponent(groupId)}/messages`, {
        id: msg.id, text: msg.text, anon,
      });
      return { ...msg, ...data.message, mine: true };
    } catch (err) {
      community.addLocalMessage(groupId, { ...msg, pending: true });
      throw err;
    }
  }
  community.addLocalMessage(groupId, msg);
  return msg;
}

async function reportMessage(groupId, messageId, reason) {
  if (isServerMode()) {
    try { await req('POST', '/api/report', { kind: 'message', groupId, messageId, reason }); } catch { /* ignore */ }
  }
  const c = community.get();
  c.reported = c.reported || [];
  c.reported.push({ kind: 'message', groupId, messageId, reason, at: Date.now() });
  community.save(c);
}

   ============================================================ */

async function listStories({ tag = '', limit = 50, mineOnly = false } = {}) {
  const mine = localStories.get().mine.map((s) => ({ ...s, mine: true, author: s.anon ? 'Anonymous' : profile.displayName(), likes: 0 }));
  if (mineOnly) return { stories: mine, local: true };

  if (!isServerMode()) {
    const seeded = SEED_STORIES.filter((s) => !localStories.isHidden(s.id));
    const all = [...mine, ...seeded].filter((s) => !tag || (s.tags || []).includes(tag));
    return { stories: all.sort((a, b) => b.createdAt - a.createdAt), local: true };
  }
  try {
    const q = new URLSearchParams();
    if (tag) q.set('tag', tag);
    q.set('limit', String(limit));
    const data = await req('GET', `/api/stories?${q}`);
    const remote = (data.stories || []).filter((s) => !localStories.isHidden(s.id));
    // merge in anything of mine that has not been published
    const unpublished = mine.filter((s) => !s.remoteId);
    return { stories: [...unpublished, ...remote].sort((a, b) => b.createdAt - a.createdAt), local: false };
  } catch (err) {
    const seeded = SEED_STORIES.filter((s) => !localStories.isHidden(s.id));
    return { stories: [...mine, ...seeded].sort((a, b) => b.createdAt - a.createdAt), local: true, error: err.message };
  }
}

async function publishStory(story) {
  if (!isServerMode()) throw new Error('Connect a community server in You → Community to publish your story to others.');
  const data = await req('POST', '/api/stories', {
    id: story.id,
    title: story.title,
    body: story.body,
    verse: story.verse,
    tags: story.tags,
    anon: story.anon,
  });
  localStories.update(story.id, { remoteId: data.story.id });
  return data.story;
}

async function likeStory(storyId) {
  const nowLiked = localStories.toggleLike(storyId);
  if (isServerMode()) {
    try { await req('POST', `/api/stories/${encodeURIComponent(storyId)}/like`, { liked: nowLiked }); } catch { /* local like stands */ }
  }
  return nowLiked;
}

async function listComments(storyId) {
  if (!isServerMode()) {
    const c = community.get();
    return (c.storyComments || {})[storyId] || [];
  }
  try {
    const data = await req('GET', `/api/stories/${encodeURIComponent(storyId)}/comments`);
    return data.comments || [];
  } catch { return []; }
}

async function addComment(storyId, text, { anon = false } = {}) {
  const me = profile.get();
  const comment = {
    id: 'cm_' + uid(), storyId, userId: anon ? 'anon' : me.id,
    name: anon ? 'Anonymous' : (me.name || 'Friend'),
    text: String(text).trim(), createdAt: Date.now(), mine: true,
  };
  if (!comment.text) throw new Error('Nothing to send.');
  if (isServerMode()) {
    const data = await req('POST', `/api/stories/${encodeURIComponent(storyId)}/comments`, { id: comment.id, text: comment.text, anon });
    return { ...comment, ...data.comment, mine: true };
  }
  const c = community.get();
  c.storyComments = c.storyComments || {};
  c.storyComments[storyId] = [...(c.storyComments[storyId] || []), comment];
  community.save(c);
  return comment;
}

async function reportStory(storyId, reason) {
  if (isServerMode()) {
    try { await req('POST', '/api/report', { kind: 'story', storyId, reason }); } catch { /* ignore */ }
  }
  localStories.hide(storyId);
}

async function listPrayerRequests() {
  if (!isServerMode()) {
    const c = community.get();
    return (c.prayerRequests || []).concat(SEED_REQUESTS);
  }
  try {
    const data = await req('GET', '/api/prayer-requests');
    return data.requests || [];
  } catch {
    const c = community.get();
    return (c.prayerRequests || []).concat(SEED_REQUESTS);
  }
}

async function addPrayerRequest({ text, anon = true, topic = '' }) {
  const me = profile.get();
  const rec = {
    id: 'pr_' + uid(), text: String(text).trim(), topic,
    name: anon ? 'Anonymous' : (me.name || 'Friend'),
    userId: anon ? 'anon' : me.id,
    createdAt: Date.now(), prayedCount: 0, mine: true,
  };
  if (!rec.text) throw new Error('Nothing to send.');
  if (isServerMode()) {
    const data = await req('POST', '/api/prayer-requests', { id: rec.id, text: rec.text, anon, topic });
    return { ...rec, ...data.request, mine: true };
  }
  const c = community.get();
  c.prayerRequests = [rec, ...(c.prayerRequests || [])].slice(0, 200);
  community.save(c);
  return rec;
}

async function prayedFor(requestId) {
  const c = community.get();
  c.prayedFor = c.prayedFor || [];
  if (c.prayedFor.includes(requestId)) return false;
  c.prayedFor.push(requestId);
  community.save(c);
  if (isServerMode()) {
    try { await req('POST', `/api/prayer-requests/${encodeURIComponent(requestId)}/prayed`); } catch { /* ignore */ }
  }
  return true;
}

  if (!all.length) {
    host.appendChild(emptyState({
      iconName: 'hands', title: 'The wall is quiet',
      text: 'Be the first to ask.',

      icon('plus'), 'Ask for prayer'),

  function paint() {
    deck.innerHTML = '';
    const left = queue.length - i;
    if (left <= 0) {

  function card(r, depth) {
    const el = h('div.deck-card', { dataset: { depth: String(depth) } });

/* ============================================================
   Highlights / notes / bookmarks
   ============================================================ */

async function renderMarks(main) {
  await B.loadCatalogue();
  setTopbar({ title: 'Highlights & notes', back: '/you' });
  main.innerHTML = '';
  const wrap = h('div.wrap');
  main.appendChild(wrap);

  let tab = 'notes';
  const tabs = h('div.picker-tabs', { style: { padding: '0 0 .8rem' } });
  const host = h('div');

  for (const [id, label] of [['notes', 'Notes'], ['highlights', 'Highlights'], ['bookmarks', 'Bookmarks']]) {
    tabs.appendChild(h('button.chip', {
      type: 'button', dataset: { t: id }, 'aria-pressed': String(tab === id),
      onclick: () => {
        tab = id;
        $$('[data-t]', tabs).forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.t === tab)));
        paint();
      },
    }, label));
  }
  wrap.append(tabs, host);
  paint();

  function paint() {
    host.innerHTML = '';
    const tr = settings.get().translation || 'KJV';

    if (tab === 'notes') {
      const notes = marks.allNotes();
      if (!notes.length) {
        host.appendChild(emptyState({ iconName: 'note', title: 'No notes yet', text: 'Tap a verse while reading, then write what it says to you.' }));
        return;
      }
      for (const n of notes) {
        host.appendChild(h('div.card', null,
          h('p.result-ref', null, B.refString(tr, n.book, n.chapter, n.verse)),
          h('p', { style: { fontSize: '.92rem', lineHeight: '1.6', marginTop: '.3rem', whiteSpace: 'pre-wrap' } }, n.text),
          h('div.story-foot', null,
            h('button.actbtn', { type: 'button', onclick: () => navigate(`/read?book=${n.book}&chapter=${n.chapter}&verse=${n.verse}`) }, icon('book'), 'Open'),
            h('div', { style: { flex: '1' } }),
            h('span.hint', null, timeAgo(n.updatedAt)),
          ),
        ));
      }
      return;
    }

    if (tab === 'highlights') {
      const list = marks.highlightList();
      if (!list.length) {
        host.appendChild(emptyState({ iconName: 'pencil', title: 'No highlights yet', text: 'Tap any verse while reading and pick a colour.' }));
        return;
      }
      const rows = h('div.rows');
      for (const x of list) {
        rows.appendChild(h('button.row', {
          type: 'button',
          onclick: () => navigate(`/read?book=${x.book}&chapter=${x.chapter}&verse=${x.verse}`),
        },
          h('span', { style: { width: '18px', height: '18px', borderRadius: '50%', flexShrink: '0', background: swatchColor(x.color) } }),
          h('span.row-body', null, h('span.row-title', null, B.refString(tr, x.book, x.chapter, x.verse))),
          h('span.row-chev', null, icon('chev')),
        ));
      }
      host.appendChild(rows);
      return;
    }

    const bms = marks.bookmarks();
    if (!bms.length) {
      host.appendChild(emptyState({ iconName: 'bookmark', title: 'No bookmarks yet', text: 'Tap a verse and choose Bookmark to keep it here.' }));
      return;
    }
    for (const b of bms) {
      host.appendChild(h('button.result', {
        type: 'button',
        onclick: () => navigate(`/read?book=${b.book}&chapter=${b.chapter}&verse=${b.verse}&tr=${b.translation}`),
      },
        h('p.result-ref', null, `${b.bookName || B.bookName(b.translation, b.book)} ${b.chapter}:${b.verse} · ${b.translation}`),
        b.text ? h('p.result-text', null, b.text) : null,
      ));
    }
  }
}

function swatchColor(c) {
  return { yellow: '#fdf0b8', green: '#cfead5', blue: '#d2e4f7', pink: '#f8d9e4', orange: '#fbdcc0', underline: 'var(--gold)' }[c] || 'var(--line-strong)';
}
